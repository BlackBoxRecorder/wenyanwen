<!DOCTYPE html>
<html lang="zh-Hans">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文言文编辑器</title>
  <link rel="stylesheet" href="editor.css">
</head>

<body>
  <!-- 顶部导航栏 -->
  <nav class="editor-nav">
    <button class="editor-btn editor-btn--primary" id="btn-save" title="保存 (Ctrl+S)">💾 保存</button>

    <span class="editor-nav-label">|</span>

    <div class="editor-nav-group">
      <button class="editor-btn editor-btn--ai" id="btn-ai-generate" title="AI 生成全文">✨ 生成全文</button>
      <button class="editor-btn editor-btn--ai" id="btn-ai-improve" title="AI 改进当前">🔧 改进当前</button>
      <button class="editor-btn editor-btn--ai" id="btn-ai-annotate" title="AI 智能标注选中文本">🏷 智能标注</button>
      <button class="editor-btn editor-btn--search" id="btn-ai-search" title="联网搜索资料">🔍 搜索资料</button>
    </div>

    <span class="editor-spacer"></span>

    <span class="editor-nav-filename" id="current-filename"></span>
    <button class="editor-btn" id="btn-theme" title="切换明暗主题">🌓 主题</button>
  </nav>

  <!-- 三栏主容器 -->
  <div class="editor-main">
    <!-- 左侧：文件浏览器 -->
    <aside class="file-browser" id="file-browser">
      <div class="file-browser-header">📂 文件列表</div>
      <div class="file-list" id="file-list">
        <div class="search-loading">加载中...</div>
      </div>
      <button class="file-new-btn" id="btn-new-file">+ 新建文件</button>
    </aside>

    <!-- 中间：编辑器面板 -->
    <section class="editor-pane">
      <div class="editor-toolbar">
        <button class="editor-btn" id="btn-ruby" title="选中汉字后点击注音 (Ctrl+R)">注音</button>
        <button class="editor-btn" id="btn-annotate" title="选中文字后点击注释 (Ctrl+N)">注释</button>
        <button class="editor-btn" id="btn-preview" title="手动预览 (Ctrl+Enter)">刷新预览</button>
        <span class="editor-status" id="toolbar-status">就绪</span>
      </div>
      <textarea id="editor" spellcheck="false" placeholder="在此编辑 .wyw 源码，或从左侧选择文件开始..."></textarea>
    </section>

    <!-- 右侧：预览面板 -->
    <aside class="preview-pane" id="preview-pane">
      <article class="wyw wyw--ancient wyw--annotation" id="preview">
        <p style="color: var(--wyw-color-text-muted); text-align: center; padding-top: 4rem;">
          选择或创建文件开始编辑<br>实时预览将显示在此处
        </p>
      </article>
    </aside>
  </div>

  <!-- 底部状态栏 -->
  <div class="editor-statusbar" id="statusbar">
    <span id="status-file">未打开文件</span>
    <span id="status-save">未修改</span>
    <span id="status-chars">0 字符</span>
    <span id="status-lines">0 行</span>
  </div>

  <!-- 新建文件弹窗 -->
  <div class="modal-overlay hidden" id="modal-new-file">
    <div class="modal">
      <h3>新建 .wyw 文件</h3>
      <div class="modal-field">
        <label>分类</label>
        <select id="new-category">
          <option value="wen">文</option>
          <option value="shi">诗</option>
          <option value="ci">词</option>
        </select>
      </div>
      <div class="modal-field">
        <label>作者</label>
        <input type="text" id="new-author" placeholder="输入作者姓名">
      </div>
      <div class="modal-field">
        <label>标题</label>
        <input type="text" id="new-title" placeholder="输入作品标题">
      </div>
      <div class="modal-actions">
        <button class="editor-btn" id="btn-cancel-new">取消</button>
        <button class="editor-btn editor-btn--primary" id="btn-confirm-new">创建</button>
      </div>
    </div>
  </div>

  <!-- 注释输入弹窗 -->
  <div class="modal-overlay hidden" id="modal-annotate">
    <div class="modal">
      <h3>添加注释</h3>
      <div class="modal-field">
        <label id="annotate-label">请输入注释（释义）：</label>
        <input type="text" id="annotate-input" placeholder="输入释义，如：简陋的屋子">
      </div>
      <div class="modal-actions">
        <button class="editor-btn" id="btn-cancel-annotate">取消</button>
        <button class="editor-btn editor-btn--primary" id="btn-confirm-annotate">确定</button>
      </div>
    </div>
  </div>

  <!-- AI 搜索结果侧面板 -->
  <div class="search-panel hidden" id="search-panel">
    <div class="search-panel-header">
      <h3>📖 参考资料</h3>
      <button class="search-panel-close" id="btn-close-search">&times;</button>
    </div>
    <div class="search-results" id="search-results">
      <p class="search-loading">搜索中...</p>
    </div>
  </div>

  <script type="module" src="editor.js"></script>
</body>

</html>
