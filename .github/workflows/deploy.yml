name: Deploy to GitHub Pages

on:
  # 当推送到 main 分支时自动触发部署
  push:
    branches: [main, master]
  # 允许手动触发部署（在 GitHub Actions 页面点击按钮）
  workflow_dispatch:

# 设置 GITHUB_TOKEN 的权限，这是部署到 GitHub Pages 所必需的
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署任务运行，避免冲突
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      # 步骤 1：检出代码（含子模块）
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 步骤 2：设置 Node.js 环境
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # 步骤 3：安装主项目依赖
      - name: Install dependencies
        run: npm ci

      # 步骤 4：安装并构建子模块 vendor/wyw
      - name: Build submodule (vendor/wyw)
        run: |
          cd vendor/wyw
          npm ci
          npm run build

      # 步骤 5：构建项目（生成 dist 目录）
      - name: Build
        run: npm run build

      # 步骤 6：配置 GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v4

      # 步骤 7：上传构建产物作为 Pages 部署源
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

      # 步骤 8：部署到 GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
